# Shared checks, called by the pull request and deploy pipelines.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  automation:
    name: n8n workflows and Compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Workflows are valid and carry no secrets
        run: node scripts/check-n8n-workflows.mjs
      - name: Compose file is valid
        run: |
          cp .env.n8n.example .env.n8n
          docker compose config --quiet

  build:
    name: Next.js build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public values (they end up in the browser bundle), so repository variables, not secrets.
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Check build configuration
        id: config
        run: |
          if [ -z "$NEXT_PUBLIC_CONVEX_URL" ] || [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::notice::Build skipped: set the NEXT_PUBLIC_CONVEX_URL and NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY repository variables to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.config.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      - if: steps.config.outputs.ready == 'true'
        run: npm run build
